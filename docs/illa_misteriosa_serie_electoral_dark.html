<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<title>Bloc dreta desglossat — illa vs. veïnes, 2009-2024</title>
<style>
  html, body { margin: 0; padding: 0; background: #1e1e1e; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  #wrap { width: 100%; height: 620px; box-sizing: border-box; padding: 8px 12px 4px 4px; }
  svg { width: 100%; height: 100%; overflow: visible; }
  .axis-line { stroke: #ccc; stroke-width: 1.2; }
  .grid-line { stroke: #444; stroke-width: 1; }
  .tick-label { font-size: 12px; font-weight: 600; fill: #f0f0f0; }
  .x-label { font-size: 11.5px; font-weight: 600; fill: #f0f0f0; }
  .bar-pp { fill: #4d7fd1; }
  .bar-cs { fill: #ff9d4d; }
  .bar-vox { fill: #7cc95a; }
  .line-veines { fill: none; stroke: #eee; stroke-width: 2.5; stroke-dasharray: 5,3; }
  .dot-veines { fill: #fff; }
  .legend-text { font-size: 13px; font-weight: 600; fill: #f5f5f5; }
  .tooltip {
    position: absolute; pointer-events: none; background: #222; color: #fff;
    font-size: 12px; padding: 5px 8px; border-radius: 4px; opacity: 0; transition: opacity 0.1s;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div id="wrap">
  <svg id="chart" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet"></svg>
</div>
<div class="tooltip" id="tooltip"></div>

<script>
// PP/Cs/Vox en % de vots vàlids, illa (secció 0801910108). Veïnes = mitjana bloc dreta veïns queen-contigus.
const data = [
  {label:"1996 Cong",     pp:65.2,  cs:0.00,  vox:0.00, veines:18.2},
  {label:"2000 Cong",     pp:68.2,  cs:0.00,  vox:0.00, veines:25.6},
  {label:"2003 Mun",      pp:50.1,  cs:0.00,  vox:0.00, veines:14.5},
  {label:"2004 Cong",     pp:52.0,  cs:0.00,  vox:0.00, veines:17.0},
  {label:"2007 Mun",      pp:50.1,  cs:9.10,  vox:0.00, veines:19.2}, // Cs debut municipal
  {label:"2008 Cong",     pp:53.9,  cs:1.70,  vox:0.00, veines:17.8},
  {label:"2009 Eur",      pp:60.32, cs:0.00,  vox:0.00, veines:20.8},
  {label:"2011 Mun",      pp:56.01, cs:4.06,  vox:0.00, veines:21.5},
  {label:"2011 Cong",     pp:57.75, cs:0.00,  vox:0.00, veines:21.5},
  {label:"2012 Parl",     pp:45.21, cs:12.53, vox:0.00, veines:26.7},
  {label:"2014 Eur",      pp:45.13, cs:11.99, vox:0.37, veines:20.8},
  {label:"2015 Mun",      pp:35.51, cs:18.58, vox:0.74, veines:23.1}, // 2015: candidatura conjunta "VOX-PFYV" (Vox+Falange), inclosa a Vox
  {label:"2015 Parl",     pp:32.53, cs:28.74, vox:0.00, veines:30.3},
  {label:"2015 Cong",     pp:41.56, cs:16.65, vox:0.00, veines:26.6},
  {label:"2017 Parl",     pp:16.61, cs:43.52, vox:0.00, veines:32.0},
  {label:"2019 Cong(a)",  pp:23.96, cs:19.45, vox:8.30, veines:23.1},
  {label:"2019 Mun",      pp:25.91, cs:20.45, vox:3.48, veines:20.7},
  {label:"2019 Eur",      pp:28.13, cs:16.51, vox:3.21, veines:17.9},
  {label:"2019 Cong(b)",  pp:31.84, cs:7.16,  vox:12.53,veines:22.1},
  {label:"2021 Parl",     pp:18.66, cs:10.48, vox:19.08,veines:20.6},
  {label:"2023 Mun",      pp:29.65, cs:2.05,  vox:13.09,veines:18.0},
  {label:"2023 Cong",     pp:35.91, cs:0.00,  vox:13.46,veines:22.3},
  {label:"2024 Parl",     pp:35.86, cs:0.95,  vox:12.64,veines:21.7},
  {label:"2024 Eur",      pp:45.65, cs:0.77,  vox:10.83,veines:22.3}
];

const svg = document.getElementById("chart");
const tooltip = document.getElementById("tooltip");
const NS = "http://www.w3.org/2000/svg";

const margin = {top: 34, right: 30, bottom: 92, left: 45};
const W = 1000, H = 620;
const plotW = W - margin.left - margin.right;
const plotH = H - margin.top - margin.bottom;

const yMax = 70, yMin = 0;
const n = data.length;
const bandW = plotW / n;
const barW = bandW * 0.6;

function xCenter(i) { return margin.left + i * bandW + bandW / 2; }
function y(v) { return margin.top + plotH - ((v - yMin) / (yMax - yMin)) * plotH; }

function el(tag, attrs) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

// grid + y axis
for (let v = 0; v <= yMax; v += 10) {
  svg.appendChild(el("line", {x1: margin.left, x2: W - margin.right, y1: y(v), y2: y(v), class: "grid-line"}));
  const t = el("text", {x: margin.left - 8, y: y(v) + 4, class: "tick-label", "text-anchor": "end"});
  t.textContent = v + "%";
  svg.appendChild(t);
}
svg.appendChild(el("line", {x1: margin.left, x2: margin.left, y1: margin.top, y2: margin.top + plotH, class: "axis-line"}));
svg.appendChild(el("line", {x1: margin.left, x2: W - margin.right, y1: margin.top + plotH, y2: margin.top + plotH, class: "axis-line"}));

// x labels (rotated)
data.forEach((d, i) => {
  const cx = xCenter(i);
  const t = el("text", {
    x: cx, y: margin.top + plotH + 16, class: "x-label",
    "text-anchor": "end", transform: `rotate(-45, ${cx}, ${margin.top + plotH + 16})`
  });
  t.textContent = d.label;
  svg.appendChild(t);
});

// stacked bars: PP (base) -> Cs -> Vox
data.forEach((d, i) => {
  const cx = xCenter(i);
  const x0 = cx - barW / 2;
  const yBase = margin.top + plotH;

  const yPPtop = y(d.pp);
  const rectPP = el("rect", {x: x0, y: yPPtop, width: barW, height: yBase - yPPtop, class: "bar-pp"});
  svg.appendChild(rectPP);

  const csTop = d.pp + d.cs;
  const yCStop = y(csTop);
  const rectCs = el("rect", {x: x0, y: yCStop, width: barW, height: yPPtop - yCStop, class: "bar-cs"});
  svg.appendChild(rectCs);

  const voxTop = d.pp + d.cs + d.vox;
  const yVoxTop = y(voxTop);
  const rectVox = el("rect", {x: x0, y: yVoxTop, width: barW, height: yCStop - yVoxTop, class: "bar-vox"});
  svg.appendChild(rectVox);

  const hoverArea = el("rect", {x: x0, y: margin.top, width: barW, height: plotH, fill: "transparent"});
  hoverArea.addEventListener("mousemove", (ev) => {
    tooltip.style.opacity = 1;
    tooltip.style.left = (ev.pageX + 12) + "px";
    tooltip.style.top = (ev.pageY - 24) + "px";
    tooltip.innerHTML = `<b>${d.label}</b><br>PP: ${d.pp.toFixed(1)}%<br>Cs: ${d.cs.toFixed(1)}%<br>Vox: ${d.vox.toFixed(1)}%<br><b>Bloc: ${voxTop.toFixed(1)}%</b><br>Veïnes: ${d.veines}%`;
  });
  hoverArea.addEventListener("mouseleave", () => { tooltip.style.opacity = 0; });
  svg.appendChild(hoverArea);
});

// veïnes line (on top)
const linePath = data.map((d, i) => (i === 0 ? "M" : "L") + xCenter(i) + "," + y(d.veines)).join(" ");
svg.appendChild(el("path", {d: linePath, class: "line-veines"}));
data.forEach((d, i) => {
  svg.appendChild(el("circle", {cx: xCenter(i), cy: y(d.veines), r: 3.5, class: "dot-veines"}));
});

// legend
const legend = el("g", {transform: `translate(${margin.left}, 10)`});
const items = [
  {x: 0,   color: "#1a3c6e", label: "PP"},
  {x: 70,  color: "#f47b20", label: "Cs"},
  {x: 140, color: "#4a7d2c", label: "Vox"}
];
items.forEach(it => {
  legend.appendChild(el("rect", {x: it.x, y: -10, width: 14, height: 14, fill: it.color}));
  const t = el("text", {x: it.x + 19, y: 1, class: "legend-text"});
  t.textContent = it.label;
  legend.appendChild(t);
});
legend.appendChild(el("line", {x1: 220, x2: 244, y1: -3, y2: -3, class: "line-veines"}));
const lt = el("text", {x: 250, y: 1, class: "legend-text"});
lt.textContent = "Mitjana veïnes queen-contigües (bloc dreta)";
legend.appendChild(lt);
svg.appendChild(legend);
</script>
</body>
</html>
