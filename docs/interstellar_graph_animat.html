<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<title>Interstellar Theme — graf animat</title>
<style>
  :root {
    --bg: #05070d;
    --bg2: #0b0f1a;
    --ink: #e8e6df;
    --dim: #7b8194;
    --c0: #e0a458;
    --c1: #5aa9c9;
    --c2: #c96b8f;
    --c3: #7fb787;
    --c4: #b98ce0;
    --line: rgba(232,230,223,0.16);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(ellipse at 30% 20%, var(--bg2), var(--bg) 70%);
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .stars {
    position: fixed; inset: 0; pointer-events: none; opacity: 0.5;
    background-image:
      radial-gradient(1px 1px at 20% 30%, white, transparent),
      radial-gradient(1px 1px at 75% 15%, white, transparent),
      radial-gradient(1px 1px at 50% 60%, white, transparent),
      radial-gradient(1px 1px at 90% 80%, white, transparent),
      radial-gradient(1px 1px at 10% 85%, white, transparent),
      radial-gradient(1px 1px at 60% 40%, white, transparent),
      radial-gradient(1px 1px at 35% 75%, white, transparent);
    background-repeat: repeat;
    background-size: 600px 600px;
  }
  header {
    padding: 2.2rem 2rem 1rem;
    text-align: center;
  }
  h1 {
    font-weight: 400;
    letter-spacing: 0.04em;
    font-size: 1.6rem;
    margin: 0 0 0.3rem;
  }
  .sub {
    color: var(--dim);
    font-size: 0.85rem;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: 0.03em;
  }
  .stage {
    max-width: 980px;
    margin: 0 auto;
    padding: 0 1rem 2rem;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 1rem;
    justify-content: center;
    margin: 1rem 0 0.6rem;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.85rem;
  }
  button#playBtn, button.zoomBtn {
    background: var(--c0);
    color: #201200;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  button#playBtn { width: 3rem; height: 3rem; font-size: 1.1rem; }
  button.zoomBtn { width: 2.2rem; height: 2.2rem; font-size: 1rem; background: rgba(232,230,223,0.12); color: var(--ink); }
  button#playBtn:hover, button.zoomBtn:hover { transform: scale(1.08); }
  .timebar {
    flex: 1;
    max-width: 380px;
    height: 3px;
    background: var(--line);
    border-radius: 2px;
    position: relative;
    cursor: pointer;
  }
  .timebar .fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    background: var(--c0);
    border-radius: 2px;
    width: 0%;
  }
  .time { color: var(--dim); min-width: 5.5rem; text-align: right; }
  .zoomGroup { display: flex; gap: 0.3rem; }
  .svgWrap {
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    background: rgba(255,255,255,0.01);
  }
  svg { width: 100%; height: 560px; display: block; cursor: grab; touch-action: none; }
  svg.grabbing { cursor: grabbing; }
  .edge { stroke: var(--line); stroke-width: 1.4; fill: none; }
  .edge.active { stroke: var(--c0); stroke-width: 2.6; opacity: 0.9; }
  .node circle {
    stroke: rgba(5,7,13,0.6);
    stroke-width: 1.5;
    transition: filter 0.25s ease;
  }
  .node.active circle {
    filter: drop-shadow(0 0 10px currentColor);
  }
  .node rect.label-bg {
    fill: rgba(5,7,13,0.72);
  }
  .node text {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    fill: var(--dim);
    font-size: 6.4px;
    text-anchor: middle;
    pointer-events: none;
  }
  .node.active text { fill: var(--ink); }
  footer {
    text-align: center;
    color: var(--dim);
    font-size: 0.75rem;
    padding: 0.8rem 1rem 2.5rem;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  footer a { color: var(--c1); }
</style>
</head>
<body>
<div class="stars"></div>
<header>
  <h1>Interstellar Theme &mdash; xarxa de compassos</h1>
  <div class="sub">nodes = compàs · arestes = transició · color = comunitat (Louvain)</div>
</header>
<div class="stage">
  <div class="controls">
    <button id="playBtn">&#9658;</button>
    <button class="zoomBtn" id="restartBtn" title="Torna a l'inici">&#8634;</button>
    <div class="timebar" id="timebar"><div class="fill" id="fill"></div></div>
    <div class="time" id="timeLabel">0:00 / 1:44</div>
    <div class="zoomGroup">
      <button class="zoomBtn" id="zoomOut">&minus;</button>
      <button class="zoomBtn" id="zoomReset">&#8859;</button>
      <button class="zoomBtn" id="zoomIn">+</button>
    </div>
  </div>
  <div class="svgWrap">
    <svg id="graph" viewBox="-320 -320 640 640">
      <g id="viewport"></g>
    </svg>
  </div>
</div>
<footer>Piano (mà dreta, melodia) · segmentació per compàs real (3/4) · Tone.js per a la síntesi &middot; perelosantos.com</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>

    if (isLoop) { bx = sx(s.x); by = sy(s.y) - 30; }
    else {
      const x1=sx(s.x), y1=sy(s.y), x2=sx(t.x), y2=sy(t.y);
      const mx=(x1+x2)/2, my=(y1+y2)/2;
      const dx=x2-x1, dy=y2-y1;
      bx = mx + (-dy*0.12); by = my + (dx*0.12);
    }
    const badgeG = document.createElementNS(svgNS, 'g');
    const bw = 13;
    const brect = document.createElementNS(svgNS, 'rect');
    brect.setAttribute('x', bx - bw/2);
    brect.setAttribute('y', by - 4.5);
    brect.setAttribute('width', bw);
    brect.setAttribute('height', 9);
    brect.setAttribute('rx', 3);
    brect.setAttribute('fill', 'var(--c0)');
    badgeG.appendChild(brect);
    const btext = document.createElementNS(svgNS, 'text');
    btext.setAttribute('x', bx);
    btext.setAttribute('y', by + 2.6);
    btext.setAttribute('text-anchor', 'middle');
    btext.setAttribute('font-family', 'ui-monospace, SF Mono, Menlo, monospace');
    btext.setAttribute('font-size', '6.5px');
    btext.setAttribute('font-weight', '600');
    btext.setAttribute('fill', '#201200');
    btext.textContent = '\u00d7' + e.weight;
    badgeG.appendChild(btext);
    viewport.appendChild(badgeG);
  }
});

const nodeEls = {};
DATA.nodes.forEach(n => {
  const g = document.createElementNS(svgNS, 'g');
  g.setAttribute('class', 'node');
  g.setAttribute('transform', `translate(${sx(n.x)},${sy(n.y)})`);
  g.style.color = communityColors[n.community % communityColors.length];
  const r = 4 + Math.sqrt(n.freq) * 3.5;
  const circle = document.createElementNS(svgNS, 'circle');
  circle.setAttribute('r', r);
  circle.setAttribute('fill', 'currentColor');
  circle.setAttribute('fill-opacity', '0.85');
  g.appendChild(circle);

  const side = labelSide[n.id];
  const shortLabel = n.id.length > 18 ? n.id.slice(0,17)+'…' : n.id;
  const ty = side === 1 ? -(r+5) : (r+10);

  const rect = document.createElementNS(svgNS, 'rect');
  const textW = Math.min(shortLabel.length * 3.6, 90);
  rect.setAttribute('class', 'label-bg');
  rect.setAttribute('x', -textW/2 - 1.5);
  rect.setAttribute('y', ty - 5);
  rect.setAttribute('width', textW + 3);
  rect.setAttribute('height', 7);
  rect.setAttribute('rx', 2);
  g.appendChild(rect);

  const text = document.createElementNS(svgNS, 'text');
  text.setAttribute('y', ty);
  text.textContent = shortLabel;
  g.appendChild(text);

  viewport.appendChild(g);
  nodeEls[n.id] = {el: g, baseR: r};
});

// ---- zoom & pan ----
let vb = {x:-320, y:-320, w:640, h:640};
function applyVB(){ svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }
function zoomAt(factor, cx, cy){
  const nw = vb.w*factor, nh = vb.h*factor;
  vb.x = cx - (cx-vb.x)*factor;
  vb.y = cy - (cy-vb.y)*factor;
  vb.w = nw; vb.h = nh;
  applyVB();
}
svg.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = svg.getBoundingClientRect();
  const px = vb.x + (e.clientX-rect.left)/rect.width*vb.w;
  const py = vb.y + (e.clientY-rect.top)/rect.height*vb.h;
  zoomAt(e.deltaY > 0 ? 1.12 : 0.89, px, py);
}, {passive:false});

let dragging = false, lastX=0, lastY=0;
svg.addEventListener('mousedown', (e) => { dragging = true; lastX=e.clientX; lastY=e.clientY; svg.classList.add('grabbing'); });
window.addEventListener('mouseup', () => { dragging=false; svg.classList.remove('grabbing'); });
window.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  const rect = svg.getBoundingClientRect();
  const dx = (e.clientX-lastX)/rect.width*vb.w;
  const dy = (e.clientY-lastY)/rect.height*vb.h;
  vb.x -= dx; vb.y -= dy;
  lastX=e.clientX; lastY=e.clientY;
  applyVB();
});
// touch support
let lastTouchDist = null, lastTouchMid=null;
svg.addEventListener('touchstart', (e) => {
  if (e.touches.length===1){ dragging=true; lastX=e.touches[0].clientX; lastY=e.touches[0].clientY; }
}, {passive:true});
svg.addEventListener('touchmove', (e) => {
  if (e.touches.length===1 && dragging){
    const rect = svg.getBoundingClientRect();
    const dx = (e.touches[0].clientX-lastX)/rect.width*vb.w;
    const dy = (e.touches[0].clientY-lastY)/rect.height*vb.h;
    vb.x -= dx; vb.y -= dy;
    lastX=e.touches[0].clientX; lastY=e.touches[0].clientY;
    applyVB();
  }
}, {passive:true});
svg.addEventListener('touchend', () => { dragging=false; });

document.getElementById('zoomIn').addEventListener('click', () => zoomAt(0.8, vb.x+vb.w/2, vb.y+vb.h/2));
document.getElementById('zoomOut').addEventListener('click', () => zoomAt(1.25, vb.x+vb.w/2, vb.y+vb.h/2));
document.getElementById('zoomReset').addEventListener('click', () => { vb = {x:-320,y:-320,w:640,h:640}; applyVB(); });

// ---- playback ----
let synth = null;
let playing = false;
let startCtxTime = 0;
let pauseOffset = 0;
let currentBarIdx = -1;
let currentActiveNode = null;
let currentActiveEdgeKey = null;

function fmtTime(s){
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return m+':'+String(sec).padStart(2,'0');
}
document.getElementById('timeLabel').textContent = '0:00 / ' + fmtTime(DATA.total_duration);

function setEdgeActive(el, active){
  if (!el) return;
  if (el.tagName === 'g') {
    el.querySelectorAll('path').forEach(p => p.classList.toggle('active', active));
  } else {
    el.classList.toggle('active', active);
  }
}

function setActiveBar(idx){
  if (idx === currentBarIdx) return;
  currentBarIdx = idx;
  if (currentActiveNode) currentActiveNode.el.classList.remove('active');
  setEdgeActive(currentActiveEdgeKey ? edgeEls[currentActiveEdgeKey] : null, false);
  currentActiveNode = null;
  currentActiveEdgeKey = null;
  const bar = DATA.bar_sequence[idx];
  if (!bar) return;

  const nodeObj = nodeEls[bar.label];
  if (nodeObj) {
    nodeObj.el.classList.add('active');
    currentActiveNode = nodeObj;
  }
  const prevBar = DATA.bar_sequence[idx-1];
  if (prevBar) {
    const key = prevBar.label+'|||'+bar.label;
    if (edgeEls[key]) {
      setEdgeActive(edgeEls[key], true);
      currentActiveEdgeKey = key;
    } else {
      currentActiveEdgeKey = null;
    }
  }
}

const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
function midiToNoteName(p){ return NOTE_NAMES[p%12] + (Math.floor(p/12)-1); }

let synthReady = null;
function loadPiano(){
  if (synthReady) return synthReady;
  synthReady = new Promise((resolve) => {
    synth = new Tone.Sampler({
      urls: {
        A1: "A1.mp3", A2: "A2.mp3", A3: "A3.mp3", A4: "A4.mp3", A5: "A5.mp3", A6: "A6.mp3", A7: "A7.mp3",
        C1: "C1.mp3", C2: "C2.mp3", C3: "C3.mp3", C4: "C4.mp3", C5: "C5.mp3", C6: "C6.mp3", C7: "C7.mp3", C8: "C8.mp3"
      },
      baseUrl: "https://tonejs.github.io/audio/salamander/",
      onload: () => resolve(synth)
    }).toDestination();
    synth.volume.value = -4;
  });
  return synthReady;
}

async function startPlayback(fromTime){
  document.getElementById('playBtn').innerHTML = '&hellip;';
  await loadPiano();
  await Tone.start();
  Tone.Transport.cancel();
  DATA.note_events.forEach(ev => {
    if (ev.time + ev.dur < fromTime) return;
    const t = Math.max(0, ev.time - fromTime);
    Tone.Transport.scheduleOnce((time) => {
      synth.triggerAttackRelease(midiToNoteName(ev.pitch), Math.max(ev.dur,0.05), time);
    }, t);
  });
  Tone.Transport.seconds = 0;
  Tone.Transport.start();
  startCtxTime = performance.now()/1000 - fromTime;
  playing = true;
  document.getElementById('playBtn').innerHTML = '&#10074;&#10074;';
  requestAnimationFrame(tick);
}

function stopPlayback(){
  Tone.Transport.stop();
  Tone.Transport.cancel();
  playing = false;
  document.getElementById('playBtn').innerHTML = '&#9658;';
}

function tick(){
  if (!playing) return;
  const elapsed = performance.now()/1000 - startCtxTime;
  pauseOffset = elapsed;
  if (elapsed >= DATA.total_duration) {
    stopPlayback();
    setActiveBar(-1);
    document.getElementById('fill').style.width = '0%';
    document.getElementById('timeLabel').textContent = '0:00 / ' + fmtTime(DATA.total_duration);
    pauseOffset = 0;
    return;
  }
  const pct = 100 * elapsed / DATA.total_duration;
  document.getElementById('fill').style.width = pct+'%';
  document.getElementById('timeLabel').textContent = fmtTime(elapsed) + ' / ' + fmtTime(DATA.total_duration);
  for (let i=0;i<DATA.bar_sequence.length;i++){
    const b = DATA.bar_sequence[i];
    if (elapsed >= b.start && elapsed < b.end){ setActiveBar(i); break; }
  }
  requestAnimationFrame(tick);
}

document.getElementById('playBtn').addEventListener('click', () => {
  if (playing) { stopPlayback(); }
  else { startPlayback(pauseOffset >= DATA.total_duration ? 0 : pauseOffset); }
});

document.getElementById('restartBtn').addEventListener('click', () => {
  const wasPlaying = playing;
  stopPlayback();
  pauseOffset = 0;
  setActiveBar(-1);
  currentBarIdx = -1;
  document.getElementById('fill').style.width = '0%';
  document.getElementById('timeLabel').textContent = '0:00 / ' + fmtTime(DATA.total_duration);
  if (wasPlaying) startPlayback(0);
});

document.getElementById('timebar').addEventListener('click', (e) => {
  const rect = e.currentTarget.getBoundingClientRect();
  const frac = (e.clientX - rect.left) / rect.width;
  const t = Math.max(0, Math.min(DATA.total_duration, frac*DATA.total_duration));
  pauseOffset = t;
  if (playing) { stopPlayback(); startPlayback(t); }
  else {
    document.getElementById('fill').style.width = (100*t/DATA.total_duration)+'%';
    document.getElementById('timeLabel').textContent = fmtTime(t) + ' / ' + fmtTime(DATA.total_duration);
    for (let i=0;i<DATA.bar_sequence.length;i++){
      const b = DATA.bar_sequence[i];
      if (t >= b.start && t < b.end){ setActiveBar(i); break; }
    }
  }
});
</script>
